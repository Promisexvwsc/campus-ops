<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方片 · 开场动画</title>
    <!--
        独立可分发的方片开场动画
        ───────────────────────
        用法 1:直接打开本文件,自动播放
        用法 2:嵌到其他页面 → <iframe src="intro-slide.html" ...></iframe>
        用法 3:网站启动时显示几秒再跳转,例如:
                <script>setTimeout(()=>location='/dashboard',4500)</script>

        依赖:同目录下的 fonts/Ma_Shan_Zheng.ttf
        节奏:0.4s 起,1.4s 字到位,2.2s 落款浮入,3s 后定格,可点击/重播
    -->
    <style>
        @font-face {
            font-family: "MaShanZheng";
            src: url("fonts/Ma_Shan_Zheng.ttf") format("truetype");
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* ===== 四角微光菱形 ===== */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border: 2px solid rgba(251,191,36,0.22);
            transform: rotate(45deg);
            box-shadow:
                0 0 40px rgba(251,191,36,0.10),
                inset 0 0 30px rgba(251,191,36,0.06);
            pointer-events: none;
        }
        body::before {
            width: clamp(110px, 22vmin, 280px);
            height: clamp(110px, 22vmin, 280px);
            top: 10%; right: 8%;
            animation: drift-a 8s ease-in-out infinite,
                       glow-pulse-a 4.5s ease-in-out infinite;
        }
        body::after {
            width: clamp(80px, 16vmin, 200px);
            height: clamp(80px, 16vmin, 200px);
            bottom: 12%; left: 10%;
            animation: drift-b 10s ease-in-out infinite,
                       glow-pulse-b 5.5s ease-in-out infinite 1.2s;
        }
        @keyframes drift-a {
            0%,100% { transform: rotate(45deg) translate(0,0); }
            50%     { transform: rotate(45deg) translate(20px, -10px); }
        }
        @keyframes drift-b {
            0%,100% { transform: rotate(45deg) translate(0,0); }
            50%     { transform: rotate(45deg) translate(-15px, 12px); }
        }
        @keyframes glow-pulse-a {
            0%,100% {
                border-color: rgba(251,191,36,0.22);
                box-shadow: 0 0 40px rgba(251,191,36,0.10),
                            inset 0 0 30px rgba(251,191,36,0.06);
            }
            50% {
                border-color: rgba(251,191,36,0.55);
                box-shadow: 0 0 90px rgba(251,191,36,0.32),
                            inset 0 0 50px rgba(251,191,36,0.14);
            }
        }
        @keyframes glow-pulse-b {
            0%,100% {
                border-color: rgba(251,191,36,0.20);
                box-shadow: 0 0 30px rgba(251,191,36,0.08),
                            inset 0 0 25px rgba(251,191,36,0.05);
            }
            50% {
                border-color: rgba(251,191,36,0.48);
                box-shadow: 0 0 70px rgba(251,191,36,0.26),
                            inset 0 0 40px rgba(251,191,36,0.12);
            }
        }

        /* ===== 中央舞台 ===== */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        /* ===== 方片俩字:粗黑描边 + 硬投影 + 金色辉光 ===== */
        .chars {
            display: flex;
            gap: clamp(16px, 3.5vw, 36px);
            font-family: "MaShanZheng", "STKaiti", "KaiTi", serif;
            font-size: clamp(110px, 24vw, 220px);
            font-weight: 700;
            line-height: 1;
            color: #fbbf24;
            user-select: none;
            -webkit-text-stroke: clamp(4px, 0.8vw, 10px) #000;
            paint-order: stroke fill;  /* 黑边在外,黄填在内 */
            filter:
                drop-shadow(0 0 clamp(8px, 1.4vw, 16px) rgba(251,191,36,0.35))
                drop-shadow(clamp(3px, 0.6vw, 7px) clamp(3px, 0.6vw, 7px) 0 #000);
        }
        .chars span {
            display: inline-block;
            transition-property: opacity, transform;
            transition-duration: 1.0s;
            transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        /* 初始:方在左外、片在右外、缩小 */
        .chars .c1 {
            opacity: 0;
            transform: translateX(clamp(-300px, -38vw, -160px)) scale(0.85);
        }
        .chars .c2 {
            opacity: 0;
            transform: translateX(clamp(160px, 38vw, 300px)) scale(0.85);
        }
        /* 触发:两字同步合拢到中央 */
        body.play .chars span {
            opacity: 1;
            transform: translateX(0) scale(1);
            transition-delay: 0.4s;
        }

        /* ===== 落款 ===== */
        .wordmark {
            text-align: center;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.55s ease-out, transform 0.55s ease-out;
        }
        body.play .wordmark {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 1.8s;
        }
        .wordmark h1 {
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(14px, 3vw, 28px);
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: clamp(4px, 1.2vw, 12px);
            padding-left: clamp(4px, 1.2vw, 12px);
            line-height: 1;
            margin: 0 0 clamp(8px, 1.2vw, 14px) 0;
        }
        .wordmark p {
            font-size: clamp(10px, 1.8vw, 16px);
            color: rgba(251,191,36,0.7);
            letter-spacing: clamp(3px, 0.7vw, 7px);
            padding-left: clamp(3px, 0.7vw, 7px);
            font-weight: 500;
            margin: 0;
        }

        /* 重置 transition,用于点击重播 */
        body.no-transition .chars span,
        body.no-transition .wordmark {
            transition: none !important;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="chars">
            <span class="c1">方</span>
            <span class="c2">片</span>
        </div>
        <div class="wordmark">
            <h1>FANG PIAN</h1>
            <p>方片新媒体 · 校园运营</p>
        </div>
    </div>
    <script>
        const body = document.body;
        function play() {
            body.classList.add('no-transition');
            body.classList.remove('play');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    body.classList.remove('no-transition');
                    requestAnimationFrame(() => body.classList.add('play'));
                });
            });
        }
        // 进站自动播放一次
        requestAnimationFrame(() => requestAnimationFrame(() => body.classList.add('play')));
        // 点击页面任意位置 → 重播
        body.addEventListener('click', play);
    </script>
</body>
</html>
