<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开屏动画测试 · 方片渐现</title>
    <style>
        @font-face {
            font-family: "MaShanZheng";
            src: url("fonts/Ma_Shan_Zheng.ttf") format("truetype");
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ===== 四角发光菱形(跟主站一样) ===== */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border: 2px solid rgba(251,191,36,0.22);
            transform: rotate(45deg);
            box-shadow:
                0 0 40px rgba(251,191,36,0.10),
                inset 0 0 30px rgba(251,191,36,0.06);
            pointer-events: none;
        }
        body::before {
            width: 220px; height: 220px;
            top: 12%; right: 10%;
            animation: drift-a 8s ease-in-out infinite,
                       glow-pulse-a 4.5s ease-in-out infinite;
        }
        body::after {
            width: 160px; height: 160px;
            bottom: 14%; left: 12%;
            animation: drift-b 10s ease-in-out infinite,
                       glow-pulse-b 5.5s ease-in-out infinite 1.2s;
        }
        @keyframes drift-a {
            0%,100% { transform: rotate(45deg) translate(0,0); }
            50%     { transform: rotate(45deg) translate(20px, -10px); }
        }
        @keyframes drift-b {
            0%,100% { transform: rotate(45deg) translate(0,0); }
            50%     { transform: rotate(45deg) translate(-15px, 12px); }
        }
        @keyframes glow-pulse-a {
            0%,100% {
                border-color: rgba(251,191,36,0.22);
                box-shadow: 0 0 40px rgba(251,191,36,0.10),
                            inset 0 0 30px rgba(251,191,36,0.06);
            }
            50% {
                border-color: rgba(251,191,36,0.55);
                box-shadow: 0 0 90px rgba(251,191,36,0.32),
                            inset 0 0 50px rgba(251,191,36,0.14);
            }
        }
        @keyframes glow-pulse-b {
            0%,100% {
                border-color: rgba(251,191,36,0.20);
                box-shadow: 0 0 30px rgba(251,191,36,0.08),
                            inset 0 0 25px rgba(251,191,36,0.05);
            }
            50% {
                border-color: rgba(251,191,36,0.48);
                box-shadow: 0 0 70px rgba(251,191,36,0.26),
                            inset 0 0 40px rgba(251,191,36,0.12);
            }
        }

        /* ===== 中心舞台 ===== */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        /* ===== 方片渐现 ===== */
        .chars {
            display: flex;
            gap: 36px;
            font-family: "MaShanZheng", "STKaiti", "KaiTi", serif;
            font-size: 220px;
            font-weight: 700;
            line-height: 1;
            color: #fbbf24;
            user-select: none;
            filter: drop-shadow(0 0 16px rgba(251,191,36,0.35));
        }
        .chars span {
            display: inline-block;
            opacity: 0;
            transform: scale(0.4);
            transition:
                opacity 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .stage.play .chars span.c1 {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.3s;
        }
        .stage.play .chars span.c2 {
            opacity: 1;
            transform: scale(1);
            transition-delay: 1.0s;
        }

        /* ===== 落款 ===== */
        .wordmark {
            text-align: center;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.55s ease-out, transform 0.55s ease-out;
        }
        .stage.play .wordmark {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 2.0s;
        }
        .wordmark h1 {
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 10px;
            padding-left: 10px;
            line-height: 1;
            margin: 0 0 12px 0;
        }
        .wordmark p {
            font-size: 12px;
            color: rgba(251,191,36,0.7);
            letter-spacing: 6px;
            padding-left: 6px;
            font-weight: 500;
            margin: 0;
        }

        /* ===== 右上控制 ===== */
        .ctrl {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        .ctrl button {
            padding: 8px 14px;
            background: transparent;
            color: rgba(251,191,36,0.75);
            border: 1.5px solid rgba(251,191,36,0.5);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .ctrl button:hover {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border-color: #fbbf24;
        }

        /* ===== 底部注释 ===== */
        .footnote {
            position: fixed;
            bottom: 14px;
            left: 0; right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(229,229,229,0.4);
            letter-spacing: 1px;
            z-index: 5;
        }
        .footnote b { color: #fbbf24; font-weight: 500; }
        .footnote a { color: rgba(251,191,36,0.7); text-decoration: underline; }

        @media (max-width: 600px) {
            .chars { font-size: 140px; gap: 22px; }
            .wordmark h1 { font-size: 18px; letter-spacing: 7px; }
            .wordmark p { font-size: 10.5px; letter-spacing: 4px; }
            body::before { width: 140px; height: 140px; top: 6%; right: 4%; }
            body::after { width: 100px; height: 100px; bottom: 8%; left: 6%; }
        }
    </style>
</head>
<body>
    <div class="ctrl">
        <button id="replay">重播</button>
    </div>

    <div class="stage" id="stage">
        <div class="chars">
            <span class="c1">方</span>
            <span class="c2">片</span>
        </div>
        <div class="wordmark">
            <h1>FANG PIAN</h1>
            <p>方片新媒体 · 校园运营</p>
        </div>
    </div>

    <div class="footnote">
        <b>开屏动画测试</b> · 方片 scale 0.4→1.0 + opacity 0→100 渐现 · 落款随后浮入 ·
        <a href="./">回主站</a>
    </div>

    <script>
        const stage = document.getElementById('stage');
        function play() {
            stage.classList.remove('play');
            // 强制 reflow 以便 transition 重新触发
            void stage.offsetWidth;
            stage.classList.add('play');
        }
        document.getElementById('replay').addEventListener('click', play);
        // 进站默认播放
        setTimeout(play, 200);
    </script>
</body>
</html>
