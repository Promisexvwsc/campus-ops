<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开屏动画测试 · 多方案对比</title>
    <script src="hanzi-writer.min.js"></script>
    <style>
        @font-face {
            font-family: "MaShanZheng";
            src: url("fonts/Ma_Shan_Zheng.ttf") format("truetype");
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background 0.3s ease;
        }

        /* ===== 四角发光菱形 ===== */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border: 2px solid rgba(251,191,36,0.22);
            transform: rotate(45deg);
            box-shadow: 0 0 40px rgba(251,191,36,0.10), inset 0 0 30px rgba(251,191,36,0.06);
            pointer-events: none;
        }
        body::before {
            width: clamp(110px, 22vmin, 280px);
            height: clamp(110px, 22vmin, 280px);
            top: 10%; right: 8%;
            animation: drift-a 8s ease-in-out infinite, glow-pulse-a 4.5s ease-in-out infinite;
        }
        body::after {
            width: clamp(80px, 16vmin, 200px);
            height: clamp(80px, 16vmin, 200px);
            bottom: 12%; left: 10%;
            animation: drift-b 10s ease-in-out infinite, glow-pulse-b 5.5s ease-in-out infinite 1.2s;
        }
        @keyframes drift-a {
            0%,100% { transform: rotate(45deg) translate(0,0); }
            50%     { transform: rotate(45deg) translate(20px, -10px); }
        }
        @keyframes drift-b {
            0%,100% { transform: rotate(45deg) translate(0,0); }
            50%     { transform: rotate(45deg) translate(-15px, 12px); }
        }
        @keyframes glow-pulse-a {
            0%,100% { border-color: rgba(251,191,36,0.22); box-shadow: 0 0 40px rgba(251,191,36,0.10), inset 0 0 30px rgba(251,191,36,0.06); }
            50%     { border-color: rgba(251,191,36,0.55); box-shadow: 0 0 90px rgba(251,191,36,0.32), inset 0 0 50px rgba(251,191,36,0.14); }
        }
        @keyframes glow-pulse-b {
            0%,100% { border-color: rgba(251,191,36,0.20); box-shadow: 0 0 30px rgba(251,191,36,0.08), inset 0 0 25px rgba(251,191,36,0.05); }
            50%     { border-color: rgba(251,191,36,0.48); box-shadow: 0 0 70px rgba(251,191,36,0.26), inset 0 0 40px rgba(251,191,36,0.12); }
        }

        /* ===== 中心舞台 ===== */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        /* ===== 共用基础(流体尺寸:跟视口宽联动) ===== */
        .chars {
            display: flex;
            gap: clamp(16px, 3.5vw, 36px);
            font-family: "MaShanZheng", "STKaiti", "KaiTi", serif;
            font-size: clamp(110px, 24vw, 220px);
            font-weight: 700;
            line-height: 1;
            color: #fbbf24;
            user-select: none;
            filter: drop-shadow(0 0 clamp(8px, 1.4vw, 16px) rgba(251,191,36,0.35));
        }
        /* ===== 方案 D 容器:HanziWriter 笔顺 ===== */
        .hz-pair {
            display: none;
            gap: clamp(14px, 2.5vw, 28px);
            filter: drop-shadow(0 0 clamp(8px, 1.4vw, 16px) rgba(251,191,36,0.35));
        }
        .hz-cell {
            width: clamp(110px, 24vw, 220px);
            height: clamp(110px, 24vw, 220px);
        }
        .hz-cell svg {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        /* 切到方案 D 时:CSS 字隐藏,HanziWriter 画板显示 */
        body[data-v="hanzi"] .chars { display: none; }
        body[data-v="hanzi"] .hz-pair { display: flex; }


        .chars span {
            display: inline-block;
            transition-property: opacity, transform, filter;
            transition-duration: 0.7s;
            transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: opacity, transform, filter;
        }
        /* 切换/重播时临时禁用 transition,让字瞬移回初始位置 */
        body.no-transition .chars span,
        body.no-transition .wordmark {
            transition: none !important;
        }

        /* ===== 方案 A: 渐现(scale 0.4→1.0, opacity 0→1) ===== */
        body[data-v="scale"] .chars span {
            opacity: 0;
            transform: scale(0.4);
        }
        body[data-v="scale"].play .chars span.c1 {
            opacity: 1; transform: scale(1); transition-delay: 0.3s;
        }
        body[data-v="scale"].play .chars span.c2 {
            opacity: 1; transform: scale(1); transition-delay: 1.0s;
        }

        /* ===== 方案 B: 合拢(两字从左右滑入中央,位移按视口比例) ===== */
        body[data-v="slide"] .chars span.c1 {
            opacity: 0; transform: translateX(clamp(-300px, -38vw, -160px)) scale(0.85);
        }
        body[data-v="slide"] .chars span.c2 {
            opacity: 0; transform: translateX(clamp(160px, 38vw, 300px)) scale(0.85);
        }
        body[data-v="slide"].play .chars span {
            opacity: 1; transform: translateX(0) scale(1);
            transition-delay: 0.4s;
            transition-duration: 1.0s;
            transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== 方案 C: 墨晕(虚化高光凝聚成清晰字,blur 跟视口) ===== */
        body[data-v="glow"] .chars span {
            opacity: 0;
            transform: scale(1.3);
            filter: blur(clamp(12px, 2.4vw, 22px)) brightness(2.4)
                    drop-shadow(0 0 clamp(14px, 2.6vw, 30px) rgba(251,191,36,0.8));
        }
        body[data-v="glow"].play .chars span.c1 {
            opacity: 1;
            transform: scale(1);
            filter: blur(0) brightness(1)
                    drop-shadow(0 0 clamp(8px, 1.4vw, 16px) rgba(251,191,36,0.35));
            transition-delay: 0.3s;
            transition-duration: 1.0s;
            transition-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        body[data-v="glow"].play .chars span.c2 {
            opacity: 1;
            transform: scale(1);
            filter: blur(0) brightness(1)
                    drop-shadow(0 0 clamp(8px, 1.4vw, 16px) rgba(251,191,36,0.35));
            transition-delay: 1.1s;
            transition-duration: 1.0s;
            transition-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ===== 落款 ===== */
        .wordmark {
            text-align: center;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.55s ease-out, transform 0.55s ease-out;
        }
        body.play .wordmark {
            opacity: 1;
            transform: translateY(0);
        }
        body[data-v="scale"].play .wordmark { transition-delay: 2.0s; }
        body[data-v="slide"].play .wordmark { transition-delay: 1.8s; }
        body[data-v="glow"].play .wordmark { transition-delay: 2.4s; }
        body[data-v="hanzi"].play .wordmark { transition-delay: 0s; }  /* JS 控制时机 */
        .wordmark h1 {
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(14px, 3vw, 28px);
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: clamp(4px, 1.2vw, 12px);
            padding-left: clamp(4px, 1.2vw, 12px);
            line-height: 1;
            margin: 0 0 clamp(8px, 1.2vw, 14px) 0;
        }
        .wordmark p {
            font-size: clamp(10px, 1.8vw, 16px);
            color: rgba(251,191,36,0.7);
            letter-spacing: clamp(3px, 0.7vw, 7px);
            padding-left: clamp(3px, 0.7vw, 7px);
            font-weight: 500;
            margin: 0;
        }

        /* ===== 顶部控制条 ===== */
        .ctrl {
            position: fixed;
            top: 14px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
            padding: 0 12px;
            flex-wrap: wrap;
        }
        .ctrl button {
            padding: 8px 14px;
            background: transparent;
            color: rgba(251,191,36,0.7);
            border: 1.5px solid rgba(251,191,36,0.4);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .ctrl button:hover {
            background: rgba(251,191,36,0.1);
            color: #fbbf24;
            border-color: #fbbf24;
        }
        .ctrl button.active {
            background: #fbbf24;
            color: #1a1a1a;
            border-color: #fbbf24;
            font-weight: 700;
        }
        .ctrl .sep {
            width: 1px;
            background: rgba(251,191,36,0.25);
            margin: 4px 4px;
        }
        .ctrl button.replay {
            background: rgba(251,191,36,0.06);
        }

        /* ===== 底部注释 ===== */
        .footnote {
            position: fixed;
            bottom: 14px; left: 0; right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(229,229,229,0.4);
            letter-spacing: 1px;
            z-index: 5;
            padding: 0 20px;
        }
        .footnote b { color: #fbbf24; font-weight: 500; }
        .footnote a { color: rgba(251,191,36,0.7); text-decoration: underline; }

        @media (max-width: 600px) {
            /* clamp 已经处理流体尺寸,这里只调小屏小细节 */
            body::before { top: 4%; right: 3%; }
            body::after { bottom: 6%; left: 4%; }
            .ctrl button { padding: 6px 10px; font-size: 12px; }
            .ctrl { gap: 6px; padding: 8px; }
        }
    </style>
</head>
<body data-v="scale">
    <div class="ctrl">
        <button data-v="scale" class="active">A · 渐现</button>
        <button data-v="slide">B · 合拢</button>
        <button data-v="glow">C · 墨晕</button>
        <button data-v="hanzi">D · 笔顺(主站)</button>
        <span class="sep"></span>
        <button class="replay" id="replay">重播</button>
    </div>

    <div class="stage" id="stage">
        <div class="chars">
            <span class="c1">方</span>
            <span class="c2">片</span>
        </div>
        <div class="hz-pair">
            <div id="hz-fang" class="hz-cell"></div>
            <div id="hz-pian" class="hz-cell"></div>
        </div>
        <div class="wordmark">
            <h1>FANG PIAN</h1>
            <p>方片新媒体 · 校园运营</p>
        </div>
    </div>

    <div class="footnote" id="caption">
        <b>方案 A · 渐现</b> ─ 两字 scale 0.4→1.0 + opacity 0→1,弹性缓动,序贯出现 ·
        <a href="./">回主站</a>
    </div>

    <script>
        const captions = {
            scale: '<b>方案 A · 渐现</b> ─ 两字 scale 0.4→1.0 + opacity 0→1,弹性缓动,序贯出现',
            slide: '<b>方案 B · 合拢</b> ─ 方从左、片从右滑入,在中央合并,缓出曲线',
            glow:  '<b>方案 C · 墨晕</b> ─ 由虚化高光凝聚成清晰字(blur 22→0, brightness 2.4→1.0),序贯出现',
            hanzi: '<b>方案 D · 笔顺(主站现版)</b> ─ HanziWriter 楷书一笔一划,真笔顺数据驱动',
        };
        const body = document.body;
        // ===== 方案 D:HanziWriter 笔顺 =====
        let hzData = null;
        let hzPlayToken = 0;  // 用来取消上一次未跑完的播放
        async function ensureHzData() {
            if (hzData) return hzData;
            const [f, p] = await Promise.all([
                fetch('hz-fang.json').then(r => r.json()),
                fetch('hz-pian.json').then(r => r.json()),
            ]);
            hzData = { '方': f, '片': p };
            return hzData;
        }
        async function playHanzi() {
            const token = ++hzPlayToken;
            try {
                await ensureHzData();
                if (token !== hzPlayToken) return;  // 期间用户切到别的方案了
                // 清掉上次 HanziWriter 生成的 SVG
                document.getElementById('hz-fang').innerHTML = '';
                document.getElementById('hz-pian').innerHTML = '';
                const cellEl = document.getElementById('hz-fang');
                const cellW = Math.max(80, Math.round(cellEl.getBoundingClientRect().width)) || 220;
                const opts = {
                    width: cellW, height: cellW, padding: 8,
                    strokeColor: '#fbbf24',
                    strokeAnimationSpeed: 2.0,
                    delayBetweenStrokes: 110,
                    showOutline: false,
                    showCharacter: false,
                    charDataLoader: (c, onLoad) => onLoad(hzData[c]),
                };
                const fang = HanziWriter.create('hz-fang', '方', opts);
                const pian = HanziWriter.create('hz-pian', '片', opts);
                await new Promise(r => fang.animateCharacter({ onComplete: r }));
                if (token !== hzPlayToken) return;
                await new Promise(r => setTimeout(r, 160));
                if (token !== hzPlayToken) return;
                await new Promise(r => pian.animateCharacter({ onComplete: r }));
                if (token !== hzPlayToken) return;
                await new Promise(r => setTimeout(r, 250));
                if (token !== hzPlayToken) return;
                // 落款:把 .play 加上,触发 wordmark transition
                body.classList.add('play');
            } catch (e) {
                console.warn('HanziWriter failed:', e);
            }
        }
        function play() {
            // ① 禁用 transition,移除 play → 字瞬间归位到初始状态(不动画)
            body.classList.add('no-transition');
            body.classList.remove('play');
            ++hzPlayToken;  // 取消任何进行中的 HanziWriter 播放
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    body.classList.remove('no-transition');
                    if (body.dataset.v === 'hanzi') {
                        // 方案 D:JS 串行写完才显落款
                        playHanzi();
                    } else {
                        // 方案 A/B/C:纯 CSS transition
                        requestAnimationFrame(() => {
                            body.classList.add('play');
                        });
                    }
                });
            });
        }
        document.querySelectorAll('.ctrl button[data-v]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.ctrl button[data-v]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                body.setAttribute('data-v', btn.dataset.v);
                document.getElementById('caption').innerHTML =
                    captions[btn.dataset.v] + ' · <a href="./">回主站</a>';
                play();
            });
        });
        document.getElementById('replay').addEventListener('click', play);
        setTimeout(play, 200);
    </script>
</body>
</html>
